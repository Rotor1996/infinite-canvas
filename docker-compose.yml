services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    depends_on:
      - docs
    restart: unless-stopped
    # 默认渠道与统计分析均可通过运行时环境变量配置，无需重新构建镜像：
    # environment:
    #   DEFAULT_API_BASE_URL: https://ai.rotor1996.top/v1
    #   API_KEY_GUIDE_URL: https://ai.rotor1996.top/
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

  docs:
    image: ghcr.io/basketikun/infinite-canvas-docs:latest
    container_name: infinite-canvas-docs
    restart: unless-stopped
