server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /doc {
        proxy_pass http://docs:3000/doc;
        proxy_set_header Host localhost:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /doc/ {
        proxy_pass http://docs:3000;
        proxy_set_header Host localhost:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media-proxy/xai-vidgen-bucket/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        set $xai_vidgen_host vidgen.x.ai;
        rewrite ^/media-proxy/xai-vidgen-bucket/(.*)$ /xai-vidgen-bucket/$1 break;
        proxy_pass https://$xai_vidgen_host;
        proxy_ssl_server_name on;
        proxy_ssl_name vidgen.x.ai;
        proxy_set_header Host vidgen.x.ai;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
